sample:
  description: Zigbee dimmable light switch based on ZBOSS stack
  name: Zigbee Light switch
tests:
  sample.zigbee.light_switch:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - ci_build
      - smoke
      - sysbuild
      - ci_samples_zigbee
  sample.zigbee.light_switch.fota:
    sysbuild: true
    build_only: true
    extra_args:
      - FILE_SUFFIX=fota
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - ci_build
      - smoke
      - sysbuild
      - ci_samples_zigbee
