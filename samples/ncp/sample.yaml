sample:
  description: Zigbee network co-processor
  name: Zigbee NCP
tests:
  sample.zigbee.ncp:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf52840dk/nrf52840
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf52840dk/nrf52840
    tags:
      - ci_build
      - smoke
      - sysbuild
      - ci_samples_zigbee
  sample.zigbee.ncp.usb:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf52840dk/nrf52840
    platform_allow:
      - nrf52840dk/nrf52840
    tags:
      - ci_build
      - ncp
      - sysbuild
      - ci_samples_zigbee
    extra_args:
      - FILE_SUFFIX=usb
  sample.zigbee.ncp.dongle:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf52840dongle/nrf52840
    platform_allow:
      - nrf52840dongle/nrf52840
    tags:
      - ci_build
      - ncp
      - sysbuild
      - ci_samples_zigbee
    extra_args:
      - FILE_SUFFIX=dongle
  sample.zigbee.ncp.p1i:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf52840dk/nrf52840
    platform_allow:
      - nrf52840dk/nrf52840
    tags:
      - ci_build
      - ncp
      - sysbuild
      - ci_samples_zigbee
    extra_args:
      - FILE_SUFFIX=p1i
