sample:
  description: Zigbee application that includes all Zigbee shell commands
  name: Zigbee application with Zigbee shell
tests:
  sample.zigbee.shell:
    build_only: true
    extra_args:
      - CONFIG_ZIGBEE_FACTORY_RESET=n
    sysbuild: true
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54l15dk/nrf54l10/cpuapp
      - nrf52840dk/nrf52840
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54l15dk/nrf54l10/cpuapp
      - nrf52840dk/nrf52840
    tags:
      - ci_build
      - shell
      - sysbuild
      - ci_samples_zigbee
  sample.zigbee.shell.usb:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf52840dk/nrf52840
      - nrf52840dongle/nrf52840
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf52840dongle/nrf52840
    tags:
      - ci_build
      - shell
      - sysbuild
      - ci_samples_zigbee
    extra_args:
      - CONFIG_ZIGBEE_FACTORY_RESET=n
      - FILE_SUFFIX=usb
